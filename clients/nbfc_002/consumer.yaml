# nbfc_002: customised LMS layout. Only the differences from the base mapping are listed.
submission_type: CONSUMER
canonical_version: "1.1"
extends: ../_base/consumer.yaml

lookups:                       # merged into the base lookups
  gender: {MALE: MALE, FEMALE: FEMALE, TRANSGENDER: TRANSGENDER}
  account_type:
    HOME_LOAN: HOUSING_LOAN
    LOAN_AGAINST_PROP: PROPERTY_LOAN
    PERSONAL: PERSONAL_LOAN
    AUTO: AUTO_LOAN
    USED_CAR: USED_CAR_LOAN
    TWO_WHEELER: TWO_WHEELER_LOAN
    COMM_VEHICLE: COMMERCIAL_VEHICLE_LOAN
    GOLD: GOLD_LOAN
    EDUCATION: EDUCATION_LOAN
    CONSUMER_DURABLE: CONSUMER_LOAN
    BIZ_UNSECURED: BUSINESS_LOAN_UNSECURED
    BIZ_SECURED: BUSINESS_LOAN_SECURED
    MFI_PERSONAL: MICROFINANCE_PERSONAL_LOAN
    MFI_BUSINESS: MICROFINANCE_BUSINESS_LOAN
    KISAN_CARD: KISAN_CREDIT_CARD
    LOAN_AGAINST_SHARES: LOAN_AGAINST_SHARES_SECURITIES
    LOAN_ON_CARD: LOAN_ON_CREDIT_CARD
    CREDIT_CARD: CREDIT_CARD
    SECURED_CARD: SECURED_CREDIT_CARD
    CORPORATE_CARD: CORPORATE_CREDIT_CARD
    FLEET_CARD: FLEET_CARD
    OVERDRAFT: OVERDRAFT

entities:
  party:
    columns:
      birth_date: b.dob                       # column renamed

  party_phone:
    selects:
      phone1:
        where: b.primary_mobile IS NOT NULL   # column renamed
        columns: {phone_number: b.primary_mobile}

  account:                                    # DPD lives in an extension table
    from: "{schema}.account_details a LEFT JOIN {schema}.loan_ext x ON x.loan_id = a.loan_id"
    columns:
      days_past_due: x.overdue_days

  extension_attribute:                        # custom field for NBFC-specific validation rules
    from: "{schema}.loan_ext x"
    where: x.scheme_code IS NOT NULL
    columns:
      entity: "'account'"
      entity_key: x.loan_id
      attr_name: "'scheme_code'"
      attr_value: x.scheme_code
