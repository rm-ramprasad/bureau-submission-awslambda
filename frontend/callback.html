<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in · Open Terrace Analytics</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="app.css">
  <script src="config.js"></script>
  <script src="vendor/oidc-client-ts.min.js"></script>
  <script src="js/core.js"></script>
</head>
<body>
<div class="center-page"><div class="login-box"><p id="status" class="muted">Signing in…</p></div></div>
<script>
  // Cognito redirects here with ?code=...&state=...: exchange the code (PKCE), then go back to the page the user asked for.
  Auth.mgr().signinRedirectCallback().then((user) => {
    sessionStorage.setItem("signed-in", "1");                // the next page records the login
    const target = typeof user.state === "string" && user.state.startsWith("/") && !user.state.startsWith("//")
      ? user.state : "/";
    location.replace(target);
  }).catch((err) => {
    document.getElementById("status").innerHTML =
      `Sign-in failed: ${String(err.message || err).replace(/</g, "&lt;")}. <a href="/">Try again</a>.`;
  });
</script>
</body>
</html>
