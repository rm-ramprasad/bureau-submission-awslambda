# Commercial UCRF 3.10: canonical value -> commercial file code, per canonical code list.
# Spec: docs/specs/Commercial_UCRF_V3_10.md (section 8 catalogues).
# Seeded into ref_code_translation / ref_code_group on deploy (python -m submissions.reference); only missing rows
# are inserted: rows edited or added in those tables are kept (the database is the master).
# A canonical value with no active translation cannot be reported in the commercial file: validation flags it.
# Several canonical values may share one code (e.g. GECL_LOAN_SECURED and GECL_LOAN_UNSECURED -> 9021).
#
# Not written as codes in the commercial file, so not translated: id_type (each identifier has its own field),
# phone_type, residence_code, ownership_indicator, collateral_type, occupation, income_basis, income_period.
# Open questions (verify with the CIC, see docs/plans/commercial-and-reference-data.md):
#  - address_category for individuals reported commercially (PERMANENT, RESIDENCE ...): no location type fits;
#    left untranslated, so such addresses are flagged.
#  - WEEKLY / FORTNIGHTLY / DAILY repayment: no commercial code, reported as 08 Others.
#  - ACCOUNT_CLOSED dishonour reason: the spec says to report it but its catalogue has only 01.

