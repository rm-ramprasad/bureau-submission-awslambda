# UCRF Consumer 3.74: canonical value -> consumer file code, per canonical code list.
# Seeded into ref_code_translation / ref_code_group on deploy (python -m submissions.reference);
# only missing rows are inserted: rows edited or added in those tables are kept (the database is the master).
# A canonical value with no active translation cannot be reported in the consumer file: validation flags it
# (generated code rules) and the layout leaves the field out. Values added for other types (commercial credit
# types, business locations, CIN ...) are deliberately not translated here: they are not reportable for consumers.
# Several canonical values may share one code (e.g. SMA_0, SMA_1, SMA_2 -> 05).

