entities:
  party:
    table: c_party
    description: One borrower (individual)
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50, description: Source borrower key}
      full_name:        {type: string, length: 200, description: Full name. Formatter splits into 26-char fields}
      birth_date:       {type: date}
      gender:           {type: code, code_list: gender}
      occupation:       {type: code, code_list: occupation}
      income:           {type: decimal}
      income_basis:     {type: code, code_list: income_basis}
      income_period:    {type: code, code_list: income_period}
      short_name:         {type: string, length: 20, description: Business borrower short name}
      legal_constitution: {type: code, code_list: legal_constitution, description: Commercial borrowers}
      business_category:  {type: code, code_list: business_category}
      industry_type:      {type: code, code_list: industry_type}
      incorporation_date: {type: date}
      activity_class_1:   {type: string, length: 5, description: RBI BSR activity / occupation classification}
      activity_class_2:   {type: string, length: 5}
      activity_class_3:   {type: string, length: 5}
      hsn_code:           {type: string, length: 20}
      sales_amount:       {type: decimal, description: Sales of the previous financial year}
      sales_year:         {type: date, description: Financial year of sales_amount (any date in it)}
      employee_count:     {type: integer}
      credit_rating:      {type: string, length: 10}
      rating_agency:      {type: code, code_list: rating_agency}
      rating_date:        {type: date}
      rating_expiry_date: {type: date}

  party_identifier:
    table: c_party_identifier
    description: One identity document of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      id_type:          {type: code, code_list: id_type}
      id_number:        {type: string, length: 50, description: As held at source. Delimiters stripped by validation/formatter}
      issue_date:       {type: date}
      expiry_date:      {type: date}

  party_phone:
    table: c_party_phone
    description: One telephone entry of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      phone_number:     {type: string, length: 60, description: May hold several numbers when type is 00}
      extension:        {type: string, length: 10}
      phone_type:       {type: code, code_list: phone_type}
      priority:         {type: integer, description: 1 = first reported. Lower sorts first}

  party_email:
    table: c_party_email
    description: One e-mail address of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      email:            {type: string, length: 100}
      priority:         {type: integer}

  party_address:
    table: c_party_address
    description: One address of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      address_line_1:   {type: string, length: 200, description: Lines are re-fitted to 40 chars by the formatter without splitting words}
      address_line_2:   {type: string, length: 200}
      address_line_3:   {type: string, length: 200}
      address_line_4:   {type: string, length: 200}
      address_line_5:   {type: string, length: 200}
      state_code:       {type: code, code_list: state_code}
      pin_code:         {type: string, length: 20, description: As held at source. Non-digits stripped by validation/formatter}
      address_category: {type: code, code_list: address_category}
      residence_code:   {type: code, code_list: residence_code}
      priority:         {type: integer}
      city:             {type: string, length: 40}
      district:         {type: string, length: 40}
      country:          {type: code, code_list: country}

  account:
    table: c_account
    description: One credit facility
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:              {type: string, length: 50, description: Source account key}
      account_number:           {type: string, length: 50}
      account_type:             {type: code, code_list: account_type}
      date_opened:              {type: date}
      date_last_payment:        {type: date}
      date_closed:              {type: date}
      date_reported:            {type: date, description: Defaults to the request as-of date}
      high_credit_amount:       {type: decimal, description: "Sanctioned amount, or highest credit used for card types"}
      current_balance:          {type: decimal, description: Signed. Negative = credit balance}
      amount_overdue:           {type: decimal}
      days_past_due:            {type: integer}
      suit_filed_status:        {type: code, code_list: suit_filed_status}
      credit_facility_status:   {type: code, code_list: credit_facility_status}
      asset_classification:     {type: code, code_list: asset_classification}
      collateral_value:         {type: decimal}
      collateral_type:          {type: code, code_list: collateral_type}
      credit_limit:             {type: decimal}
      cash_limit:               {type: decimal}
      rate_of_interest:         {type: decimal, precision: 10, scale: 4}
      repayment_tenure:         {type: integer, description: Months}
      emi_amount:               {type: decimal}
      written_off_total:        {type: decimal}
      written_off_principal:    {type: decimal}
      settlement_amount:        {type: decimal}
      payment_frequency:        {type: code, code_list: payment_frequency}
      actual_payment_amount:    {type: decimal}
      old_member_code:          {type: string, length: 10}
      old_member_short_name:    {type: string, length: 16}
      old_account_number:       {type: string, length: 50}
      old_account_type:         {type: code, code_list: account_type}
      old_ownership_indicator:  {type: code, code_list: ownership_indicator}
      branch_code:              {type: string, length: 15, description: Member branch that granted the facility}
      previous_branch_code:     {type: string, length: 15}
      previous_account_number:  {type: string, length: 50}
      sanctioned_amount:        {type: decimal, description: Sanctioned / notional amount (in currency)}
      currency:                 {type: code, code_list: currency, description: Currency of sanctioned_amount. Other amounts are INR}
      drawing_power:            {type: decimal}
      restructured_notional_amount: {type: decimal, description: Derivatives only}
      maturity_date:            {type: date}
      renewal_date:             {type: date}
      asset_classification_date: {type: date}
      overdue_bucket_1:         {type: decimal, description: Overdue 1-30 days}
      overdue_bucket_2:         {type: decimal, description: Overdue 31-60 days}
      overdue_bucket_3:         {type: decimal, description: Overdue 61-90 days}
      overdue_bucket_4:         {type: decimal, description: Overdue 91-180 days}
      overdue_bucket_5:         {type: decimal, description: Overdue above 180 days}
      status_date:              {type: date, description: Date credit_facility_status (or closure) took effect}
      restructuring_reason:     {type: code, code_list: restructuring_reason}
      npa_contracts_amount:     {type: decimal, description: Derivatives only}
      security_coverage:        {type: code, code_list: coverage}
      guarantee_coverage:       {type: code, code_list: coverage}
      remark:                   {type: string, length: 100}
      wilful_default_date:      {type: date, description: Set = classified as wilful defaulter on this date}
      suit_reference:           {type: string, length: 25}
      suit_amount:              {type: decimal}
      suit_date:                {type: date}
      dispute_id:               {type: string, length: 20}
      other_lenders:            {type: string, length: 42, description: Other banks / FIs (consortium)}
      ufce_amount:              {type: decimal, description: Unhedged foreign currency exposure}
      ufce_date:                {type: date}

  account_holder:
    table: c_account_holder
    description: Link of a borrower to an account. Each row becomes one UCRF record
    indexes: [[account_key], [party_key]]
    keys: {account: account_key, party: party_key}
    columns:
      account_key:          {type: string, length: 50}
      party_key:            {type: string, length: 50}
      ownership_indicator:  {type: code, code_list: ownership_indicator}

  account_history:
    table: c_account_history
    description: One month of account history (initial historical load only)
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:            {type: string, length: 50}
      history_month:          {type: date, description: Any day of the month. Formatter resets the day to 01}
      days_past_due:          {type: integer}
      asset_classification:   {type: code, code_list: asset_classification, description: Used when days_past_due is absent}
      amount_overdue:         {type: decimal}
      high_credit_amount:     {type: decimal}
      credit_limit:           {type: decimal}
      cash_limit:             {type: decimal}
      current_balance:        {type: decimal}
      date_last_payment:      {type: date}
      actual_payment_amount:  {type: decimal}

  relationship:
    table: c_relationship
    description: A party related to a business borrower (director, partner, holding company ...). Commercial
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:            {type: string, length: 50, description: The borrower}
      relationship_type:    {type: code, code_list: relationship_type}
      control_percentage:   {type: decimal, precision: 5, scale: 2, description: Shares held (in either direction) in percent}
      related_key:          {type: string, length: 50, description: Source key of the related party or guarantor}
      related_type:         {type: code, code_list: related_type}
      full_name:            {type: string, length: 150, description: Entity name or individual full name}
      name_prefix:          {type: string, length: 15, description: "Individuals - Mr, Ms, Dr ..."}
      business_category:    {type: code, code_list: business_category}
      industry_type:        {type: code, code_list: industry_type}
      gender:               {type: code, code_list: gender}
      birth_date:           {type: date}
      incorporation_date:   {type: date}
      pan:                  {type: string, length: 20}
      voter_id:             {type: string, length: 30}
      passport:             {type: string, length: 30}
      driving_licence:      {type: string, length: 30}
      aadhaar:              {type: string, length: 30}
      ration_card:          {type: string, length: 30}
      company_registration: {type: string, length: 30}
      cin:                  {type: string, length: 30}
      din:                  {type: string, length: 12}
      tin:                  {type: string, length: 30}
      service_tax:          {type: string, length: 30}
      ckyc:                 {type: string, length: 30}
      udyam:                {type: string, length: 30}
      address_line_1:       {type: string, length: 200}
      address_line_2:       {type: string, length: 200}
      address_line_3:       {type: string, length: 200}
      city:                 {type: string, length: 40}
      district:             {type: string, length: 40}
      state_code:           {type: code, code_list: state_code}
      pin_code:             {type: string, length: 20}
      country:              {type: code, code_list: country}
      mobile:               {type: string, length: 60, description: Comma-separated numbers allowed}
      telephone:            {type: string, length: 60}
      telephone_area_code:  {type: string, length: 6}
      fax:                  {type: string, length: 60}
      fax_area_code:        {type: string, length: 6}

  guarantor:
    table: c_guarantor
    description: A guarantor of a credit facility. Commercial
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:          {type: string, length: 50}
      related_key:          {type: string, length: 50, description: Source key of the related party or guarantor}
      related_type:         {type: code, code_list: related_type}
      full_name:            {type: string, length: 150, description: Entity name or individual full name}
      name_prefix:          {type: string, length: 15, description: "Individuals - Mr, Ms, Dr ..."}
      business_category:    {type: code, code_list: business_category}
      industry_type:        {type: code, code_list: industry_type}
      gender:               {type: code, code_list: gender}
      birth_date:           {type: date}
      incorporation_date:   {type: date}
      pan:                  {type: string, length: 20}
      voter_id:             {type: string, length: 30}
      passport:             {type: string, length: 30}
      driving_licence:      {type: string, length: 30}
      aadhaar:              {type: string, length: 30}
      ration_card:          {type: string, length: 30}
      company_registration: {type: string, length: 30}
      cin:                  {type: string, length: 30}
      din:                  {type: string, length: 12}
      tin:                  {type: string, length: 30}
      service_tax:          {type: string, length: 30}
      ckyc:                 {type: string, length: 30}
      udyam:                {type: string, length: 30}
      address_line_1:       {type: string, length: 200}
      address_line_2:       {type: string, length: 200}
      address_line_3:       {type: string, length: 200}
      city:                 {type: string, length: 40}
      district:             {type: string, length: 40}
      state_code:           {type: code, code_list: state_code}
      pin_code:             {type: string, length: 20}
      country:              {type: code, code_list: country}
      mobile:               {type: string, length: 60, description: Comma-separated numbers allowed}
      telephone:            {type: string, length: 60}
      telephone_area_code:  {type: string, length: 6}
      fax:                  {type: string, length: 60}
      fax_area_code:        {type: string, length: 6}
      guarantee_invocation_date: {type: date}

  security:
    table: c_security
    description: A tangible security for a credit facility. Commercial
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:              {type: string, length: 50}
      security_value:           {type: decimal}
      currency:                 {type: code, code_list: currency}
      security_type:            {type: code, code_list: security_type}
      security_classification:  {type: code, code_list: security_classification}
      valuation_date:           {type: date}

  cheque_dishonour:
    table: c_cheque_dishonour
    description: An inward cheque dishonoured on a credit facility. Commercial
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:          {type: string, length: 50}
      dishonour_date:       {type: date}
      amount:               {type: decimal}
      instrument_number:    {type: string, length: 30}
      dishonour_count:      {type: integer}
      cheque_issue_date:    {type: date, description: Only for a single dishonoured cheque}
      reason:               {type: code, code_list: dishonour_reason}

  extension_attribute:
    table: c_extension_attribute
    description: NBFC-specific values for custom validation rules. Never written to bureau files
    indexes: [[entity, entity_key]]
    columns:
      entity:       {type: string, length: 30, description: party or account}
      entity_key:   {type: string, length: 50}
      attr_name:    {type: string, length: 64}
      attr_value:   {type: string, length: 500}
