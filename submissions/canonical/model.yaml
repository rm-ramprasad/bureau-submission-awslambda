# Canonical model: the data contract shared by every submission type (consumer, commercial, ...).
#
# Every adapter maps an NBFC schema INTO this model; validation and file writers read ONLY this model.
# It holds no submission-type knowledge: what a type requires, its file codes and its rules live in
# submissions/types/<type>/ (requirements.yaml, codes.yaml, rules.yaml, layout.yaml).
# Built from this file: snapshot tables (c_*), canonical reference data (ref_code, ref_state_pin).
# Changing this file is a product release: bump canonical_version and add a migration (never edit an applied one);
#   python -m submissions.canonical.generate prints the full CREATE script as a reference.
#
# Column keys: type (string|code|date|decimal|integer), length (string/code), code_list (code), description.
# Entity keys: keys {account, party} name the columns that tie a row to a record (findings point at records
#              through them); an entity without keys (extension_attribute) has findings that hit no record.
# Rules of the model:
#  - Code columns hold the canonical (standard) values below, never client codes and never file codes: mappings
#    translate client codes in, each file writer translates canonical values out (ref_code_translation).
#    Code columns are wide enough to carry an UNMAPPED raw client value through, so validation can report it.
#  - The snapshot accepts whatever the source holds (no unique constraints); validation judges it.
#  - No semicolons in descriptions (the migration runner splits statements on ';').

canonical_version: "1.0"

code_lists:
  gender:
    description: Gender
    codes:
      FEMALE: Female
      MALE: Male
      TRANSGENDER: Transgender

  id_type:
    description: Identity document type
    codes:
      PAN: PAN
      PASSPORT: Passport
      VOTER_ID: Voter ID
      DRIVING_LICENCE: Driving Licence
      RATION_CARD: Ration Card
      AADHAAR: UID (Aadhaar)
      ADDITIONAL_ID_1: Additional ID 1 (future use)
      ADDITIONAL_ID_2: Additional ID 2 (future use)
      CKYC: CKYC
      G_RAM_G: G RAM G

  phone_type:
    description: Telephone type
    codes:
      NOT_CLASSIFIED: Not Classified
      MOBILE: Mobile
