      MICROFINANCE_BUSINESS_LOAN: Microfinance - Business Loan
      MICROFINANCE_PERSONAL_LOAN: Microfinance - Personal Loan
      MICROFINANCE_HOUSING_LOAN: Microfinance - Housing Loan
      MICROFINANCE_OTHERS: Microfinance - Others
      PMAY_CLSS: Pradhan Mantri Awas Yojana - CLSS
      P2P_PERSONAL_LOAN: P2P Personal Loan
      P2P_AUTO_LOAN: P2P Auto Loan
      P2P_EDUCATION_LOAN: P2P Education Loan
      BUSINESS_LOAN_SECURED: Business Loan - Secured
      BUSINESS_LOAN_GENERAL: Business Loan - General
      BUSINESS_LOAN_PRIORITY_SECTOR_SMALL_BUSINESS: Business Loan - Priority Sector - Small Business
      BUSINESS_LOAN_PRIORITY_SECTOR_AGRICULTURE: Business Loan - Priority Sector - Agriculture
      BUSINESS_LOAN_PRIORITY_SECTOR_OTHERS: Business Loan - Priority Sector - Others
