    codes:
      INDIVIDUAL: Individual
      AUTHORISED_USER: Authorised User
      GUARANTOR: Guarantor
      JOINT: Joint
      DECEASED: Deceased

  suit_filed_status:
    description: Suit filed / wilful default
    codes:
      NO_SUIT_FILED: No Suit Filed
      SUIT_FILED: Suit Filed
      WILFUL_DEFAULT: Wilful Default
      SUIT_FILED_WILFUL_DEFAULT: Suit Filed (Wilful Default)

  credit_facility_status:
    description: Special status of a credit facility (restructured, written off, settled ...)
    codes:
      RESTRUCTURED_LOAN: Restructured Loan
      RESTRUCTURED_LOAN_GOVT_MANDATED: Restructured Loan (Govt. Mandated)
      WRITTEN_OFF: Written-off
      SETTLED: Settled
      POST_WO_SETTLED: Post (WO) Settled
      ACCOUNT_SOLD: Account Sold
      WRITTEN_OFF_AND_ACCOUNT_SOLD: Written Off and Account Sold
      ACCOUNT_PURCHASED: Account Purchased
      ACCOUNT_PURCHASED_AND_WRITTEN_OFF: Account Purchased and Written Off
      ACCOUNT_PURCHASED_AND_SETTLED: Account Purchased and Settled
      ACCOUNT_PURCHASED_AND_RESTRUCTURED: Account Purchased and Restructured
      RESTRUCTURED_DUE_TO_NATURAL_CALAMITY: Restructured due to Natural Calamity
      RESTRUCTURED_DUE_TO_COVID_19: Restructured due to COVID-19
      POST_WRITE_OFF_CLOSED: Post Write Off Closed
      RESTRUCTURED_CLOSED: Restructured & Closed
      AUCTIONED_SETTLED: Auctioned & Settled
      REPOSSESSED_SETTLED: Repossessed & Settled
      GUARANTEE_INVOKED: Guarantee Invoked
      CLEAR_STATUS: Clear existing status

  asset_classification:
    description: Asset classification
    codes:
      STANDARD: Standard
      SUBSTANDARD: Substandard
      DOUBTFUL: Doubtful
      LOSS: Loss
      SPECIAL_MENTION_ACCOUNT: Special Mention Account

  collateral_type:
    description: Type of collateral
    codes:
      NONE: None
      PROPERTY: Property
      GOLD: Gold
      SHARES: Shares
      SAVINGS_ACCOUNT_FD: Savings Account & FD
      MULTIPLE_SECURITIES: Multiple Securities
      OTHERS: Others

  payment_frequency:
    description: Repayment frequency
    codes:
      WEEKLY: Weekly
      FORTNIGHTLY: Fortnightly
      MONTHLY: Monthly
      QUARTERLY: Quarterly
      BULLET: Bullet
      DAILY: Daily
      HALF_YEARLY: Half-yearly
      YEARLY: Yearly
      ON_DEMAND: On-demand

  occupation:
    description: Occupation
    codes:
      SALARIED: Salaried
      SELF_EMPLOYED_PROFESSIONAL: Self-Employed Professional
      SELF_EMPLOYED: Self-Employed
      OTHERS: Others

  income_basis:
    description: Net / gross income
    codes:
      GROSS: Gross
      NET: Net

  income_period:
    description: Monthly / annual income
    codes:
      MONTHLY: Monthly
      ANNUAL: Annual

entities:
  party:
    table: c_party
    description: One borrower (individual)
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50, description: Source borrower key}
      full_name:        {type: string, length: 200, description: Full name. Formatter splits into 26-char fields}
      birth_date:       {type: date}
      gender:           {type: code, code_list: gender}
      occupation:       {type: code, code_list: occupation}
      income:           {type: decimal}
      income_basis:     {type: code, code_list: income_basis}
      income_period:    {type: code, code_list: income_period}

  party_identifier:
    table: c_party_identifier
    description: One identity document of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      id_type:          {type: code, code_list: id_type}
      id_number:        {type: string, length: 50, description: As held at source. Delimiters stripped by validation/formatter}
      issue_date:       {type: date}
      expiry_date:      {type: date}

  party_phone:
    table: c_party_phone
    description: One telephone entry of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      phone_number:     {type: string, length: 60, description: May hold several numbers when type is 00}
      extension:        {type: string, length: 10}
      phone_type:       {type: code, code_list: phone_type}
      priority:         {type: integer, description: 1 = first reported. Lower sorts first}

  party_email:
    table: c_party_email
    description: One e-mail address of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      email:            {type: string, length: 100}
      priority:         {type: integer}

  party_address:
    table: c_party_address
    description: One address of a borrower
    indexes: [[party_key]]
    keys: {party: party_key}
    columns:
      party_key:        {type: string, length: 50}
      address_line_1:   {type: string, length: 200, description: Lines are re-fitted to 40 chars by the formatter without splitting words}
      address_line_2:   {type: string, length: 200}
      address_line_3:   {type: string, length: 200}
      address_line_4:   {type: string, length: 200}
      address_line_5:   {type: string, length: 200}
      state_code:       {type: code, code_list: state_code}
      pin_code:         {type: string, length: 20, description: As held at source. Non-digits stripped by validation/formatter}
      address_category: {type: code, code_list: address_category}
      residence_code:   {type: code, code_list: residence_code}
      priority:         {type: integer}

  account:
    table: c_account
    description: One credit facility
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:              {type: string, length: 50, description: Source account key}
      account_number:           {type: string, length: 50}
      account_type:             {type: code, code_list: account_type}
      date_opened:              {type: date}
      date_last_payment:        {type: date}
      date_closed:              {type: date}
      date_reported:            {type: date, description: Defaults to the request as-of date}
      high_credit_amount:       {type: decimal, description: "Sanctioned amount, or highest credit used for card types"}
      current_balance:          {type: decimal, description: Signed. Negative = credit balance}
      amount_overdue:           {type: decimal}
      days_past_due:            {type: integer}
      suit_filed_status:        {type: code, code_list: suit_filed_status}
      credit_facility_status:   {type: code, code_list: credit_facility_status}
      asset_classification:     {type: code, code_list: asset_classification}
      collateral_value:         {type: decimal}
      collateral_type:          {type: code, code_list: collateral_type}
      credit_limit:             {type: decimal}
      cash_limit:               {type: decimal}
      rate_of_interest:         {type: decimal, precision: 10, scale: 4}
      repayment_tenure:         {type: integer, description: Months}
      emi_amount:               {type: decimal}
      written_off_total:        {type: decimal}
      written_off_principal:    {type: decimal}
      settlement_amount:        {type: decimal}
      payment_frequency:        {type: code, code_list: payment_frequency}
      actual_payment_amount:    {type: decimal}
      old_member_code:          {type: string, length: 10}
      old_member_short_name:    {type: string, length: 16}
      old_account_number:       {type: string, length: 50}
      old_account_type:         {type: code, code_list: account_type}
      old_ownership_indicator:  {type: code, code_list: ownership_indicator}

  account_holder:
    table: c_account_holder
    description: Link of a borrower to an account. Each row becomes one UCRF record
    indexes: [[account_key], [party_key]]
    keys: {account: account_key, party: party_key}
    columns:
      account_key:          {type: string, length: 50}
      party_key:            {type: string, length: 50}
      ownership_indicator:  {type: code, code_list: ownership_indicator}

  account_history:
    table: c_account_history
    description: One month of account history (initial historical load only)
    indexes: [[account_key]]
    keys: {account: account_key}
    columns:
      account_key:            {type: string, length: 50}
      history_month:          {type: date, description: Any day of the month. Formatter resets the day to 01}
      days_past_due:          {type: integer}
      asset_classification:   {type: code, code_list: asset_classification, description: Used when days_past_due is absent}
      amount_overdue:         {type: decimal}
      high_credit_amount:     {type: decimal}
      credit_limit:           {type: decimal}
      cash_limit:             {type: decimal}
      current_balance:        {type: decimal}
      date_last_payment:      {type: date}
      actual_payment_amount:  {type: decimal}

  extension_attribute:
    table: c_extension_attribute
    description: NBFC-specific values for custom validation rules. Never written to bureau files
    indexes: [[entity, entity_key]]
    columns:
      entity:       {type: string, length: 30, description: party or account}
      entity_key:   {type: string, length: 50}
      attr_name:    {type: string, length: 64}
      attr_value:   {type: string, length: 500}
